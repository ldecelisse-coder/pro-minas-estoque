<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101485">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pró-Minas Estoque">

  <title>Pró-Minas Estoque</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #101485;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    #app {
      position: fixed;
      inset:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background: #fff;
    }

    #formulario {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }

    #carregando {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101485;
      color: #fff;
      transition: opacity .25s ease, visibility .25s ease;
    }

    #carregando.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #carregando img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 18px;
      background: #fff;
    }

    #carregando strong {
      font-size: 22px;
      margin-bottom: 6px;
    }

    #carregando span {
      font-size: 13px;
      opacity: .85;
    }

    #fallback {
      display: none;
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    #fallback a {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #101485;
      color: #fff;
      font-weight: 800;
      padding: 16px;
      border-radius: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
  </style>
</head>

<body>
  <div id="carregando">
    <img src="./icon-192.png" alt="Pró-Minas">
    <strong>Pró-Minas</strong>
    <span>Abrindo controle de estoque...</span>
  </div>

  <main id="app">
    <iframe
      id="formulario"
      src="https://script.google.com/macros/s/AKfycbynSGwQE4G6nqe4wEvM79-5UFJuw9dAiQIATAm5omK2PUXpdrP0P-mLKjEaCmRqlnSl/exec"
      title="Pró-Minas - Informar Falta"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>

  <div id="fallback">
    <a href="https://script.google.com/macros/s/AKfycbynSGwQE4G6nqe4wEvM79-5UFJuw9dAiQIATAm5omK2PUXpdrP0P-mLKjEaCmRqlnSl/exec" target="_blank" rel="noopener">
      Abrir formulário
    </a>
  </div>

  <script>
    const iframe = document.getElementById('formulario');
    const carregando = document.getElementById('carregando');
    const fallback = document.getElementById('fallback');

    let carregou = false;

    iframe.addEventListener('load', () => {
      carregou = true;
      setTimeout(() => carregando.classList.add('oculto'), 250);
    });

    // Se o navegador bloquear o conteúdo incorporado, mostra uma saída simples.
    setTimeout(() => {
      if (!carregou) {
        carregando.classList.add('oculto');
        fallback.style.display = 'block';
      }
    }, 12000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
